<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout | Chocobar</title>
  <link rel="stylesheet" href="main.css">
  <link rel="stylesheet" href="cart.css">
</head>

<body>
  <header class="header">
    <nav class="navbar">
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="products.html">Products</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>

      <a href="cart.html" class="cart-link" aria-label="View Cart">
        <svg xmlns="http://w3.org" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="9" cy="21" r="1"></circle>
          <circle cx="20" cy="21" r="1"></circle>
          <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
        </svg>
      </a>
    </nav>
    <h1>Your Cart &amp; Checkout</h1>
  </header>

  <main>
    <section class="checkout-container">
      <!-- Left: Cart Items Summary -->
      <div class="cart-summary-box">
        <h2>Selected Chocolates</h2>
        <div id="cart-items"></div>
        <div class="total-bar">
          <span>Estimated Total:</span>
          <strong id="cart-total">€0.00</strong>
        </div>
      </div>

      <!-- Right: Checkout Form -->
      <div class="checkout-form-box">
        <h2>Delivery &amp; Payment Details</h2>
        <form onsubmit="completeOrder(event)">
          <div class="form-group">
            <label for="username">Full Name</label>
            <input type="text" id="username" placeholder="Enter your full name" required>
          </div>

          <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" placeholder="you@example.com" required>
          </div>

          <div class="form-group">
            <label>Preferred Currency</label>
            <div class="radio-row">
              <label><input type="radio" name="currency" value="euro" checked> Euro (€)</label>
              <label><input type="radio" name="currency" value="dollar"> Dollar ($)</label>
              <label><input type="radio" name="currency" value="pounds"> Pounds (£)</label>
            </div>
          </div>

          <div class="form-group">
            <label for="address">Delivery Address &amp; Gift Note</label>
            <textarea id="address" rows="4" placeholder="Street address, city, postal code, and optional gift card message..." required></textarea>
          </div>

          <button type="submit" class="place-order-btn">Confirm &amp; Place Order</button>
        </form>
      </div>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Chocobar. All rights reserved.</p>
  </footer>

  <script src="cart.js"></script>
</body>

</html>
